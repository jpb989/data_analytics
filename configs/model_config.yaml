models:
  logistic_regression:
    C: 1.0
    max_iter: 1000
    solver: "lbfgs"
    random_state: 42

  random_forest:
    n_estimators: 150
    max_depth: 8
    min_samples_split: 5
    min_samples_leaf: 2
    random_state: 42
    n_jobs: -1

  xgboost:
    n_estimators: 150
    max_depth: 5
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8
    random_state: 42
    eval_metric: "logloss"

evaluation_metrics:
  - roc_auc
  - pr_auc
  - f1_macro
  - f1_weighted
  - brier_score
  - precision
  - recall
  - accuracy
