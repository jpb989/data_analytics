dataset_name: "telco_churn"
data_url: "https://raw.githubusercontent.com/IBM/telco-customer-churn-on-icp4d/master/data/Telco-Customer-Churn.csv"
target_column: "Churn"
target_positive_value: "Yes"
id_column: "customerID"

numerical_features:
  - tenure
  - MonthlyCharges
  - TotalCharges

categorical_features:
  - gender
  - SeniorCitizen
  - Partner
  - Dependents
  - PhoneService
  - MultipleLines
  - InternetService
  - OnlineSecurity
  - OnlineBackup
  - DeviceProtection
  - TechSupport
  - StreamingTV
  - StreamingMovies
  - Contract
  - PaperlessBilling
  - PaymentMethod

split_ratio:
  train: 0.70
  val: 0.15
  test: 0.15
  random_state: 42
